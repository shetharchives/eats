<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eats — Ky & friends</title>
<style>
  :root{
    --bg:#f4f1ea; --ink:#16130f; --muted:#7a7268; --line:#d9d3c7; --card:#fbf9f4;
    --accent:#e2462c; --chip:#ebe6dc; --top:0px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:15px/1.45 ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
  html,body{height:100%}
  body{overflow:hidden}
  .layout{display:flex;height:100vh;height:100dvh}
  .side{width:460px;flex:none;height:100%;overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);padding:0 18px}
  header{padding:22px 0 10px}
  h1{font-size:34px;line-height:1;letter-spacing:-.035em;margin:0;font-weight:800}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin-top:8px;font-size:13px}
  .mapcol{flex:1;position:relative;height:100%;background:#e9e4d9;order:2}
  #map{width:100%;height:100%}
  .mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
  .maptoggle{display:none;position:absolute;right:10px;bottom:24px;z-index:3;font:600 12px/1 ui-sans-serif,-apple-system,Arial;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 12px}
  .banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 12px;border-radius:999px;z-index:2;white-space:nowrap}

  .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .top{display:flex;gap:8px;align-items:center}
  input[type=search]{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink)}
  .frows{display:flex;flex-direction:column;gap:9px}
  .ftoggle{display:none;flex:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .ftoggle.on{background:var(--ink);color:var(--bg)}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .row .lbl{flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);align-self:center;margin-right:2px}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip small{opacity:.55;margin-left:4px}

  section.city{margin-top:22px}
  .city>h2{font-size:24px;letter-spacing:-.03em;margin:0 0 4px;font-weight:800;display:flex;align-items:baseline;gap:10px}
  .city>h2 small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:18px 0 10px;font-weight:600;border-top:1px solid var(--line);padding-top:12px}
  .grid{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,box-shadow .15s;scroll-margin-top:170px;cursor:pointer}
  .card:hover{border-color:#bfb6a6}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card h4{margin:0;font-size:17px;letter-spacing:-.01em}
  .area{font-size:13px;color:var(--muted)}
  .card p{margin:2px 0 4px}
  .meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);margin-top:auto}
  .by{display:inline-block;padding:1px 7px;border-radius:999px;background:#dfe8f3;color:var(--ink);font-weight:600}
  .by.Ky{background:#f6dcd3}
  .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--ink);color:var(--bg)}
  .embeds{display:flex;flex-direction:column;gap:10px}
  .embeds iframe{width:100%;height:540px;border:0;border-radius:10px;background:#fff}
  /* compact list rows */
  .card .sum{margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .who{font-size:12px;color:var(--muted);margin-top:4px}
  /* place details (replaces the list, like Google Maps) */
  body.detailing .side>header, body.detailing .bar, body.detailing #list, body.detailing footer{display:none}
  .detail{padding:0 0 40px}
  .dtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .back{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:6px}
  .xbtn{font:inherit;font-size:20px;line-height:1;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .detail h2{font-size:30px;letter-spacing:-.03em;line-height:1.05;margin:16px 0 6px;font-weight:800}
  .detail .area{font-size:14px}
  .detail .dsum{font-size:16px;margin:12px 0}
  .detail .meta{gap:4px;margin:0 0 12px}
  .detail .acts{margin:4px 0 16px}
  .detail .embeds iframe{height:620px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  footer{padding:24px 0 30px;color:var(--muted);font-size:12px}

  /* Google InfoWindow */
  .iw{max-width:260px;font:14px/1.4 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  .iw b{font-size:16px;display:block;margin-bottom:2px}
  .iw .s{color:var(--muted);font-size:12px;margin-bottom:6px}
  .iw a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:10px;font-size:13px}

  @media (max-width:900px){
    /* phones: the page itself scrolls (keeps pull-to-refresh), map stays pinned on top */
    html,body{height:auto;overflow:visible;overflow-x:clip;max-width:100%}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    /* lock the page to the screen width: vertical scrolling only (no pinch or double-tap zoom) */
    .side{touch-action:pan-y}
    .row{touch-action:pan-x pan-y}
    /* 16px stops iPhone zooming in when you tap the search box */
    input[type=search]{font-size:16px}
    body{--maph:44vh}
    body.mapbig{--maph:72vh}
    @supports (height:1svh){ body{--maph:44svh} body.mapbig{--maph:72svh} }
    .layout{display:block;height:auto}
    .mapcol{position:sticky;top:0;z-index:6;height:var(--maph);border-bottom:1px solid var(--line);transition:height .2s}
    .side{width:100%;height:auto;overflow:visible;border-right:0;padding:0 14px}
    .bar{top:var(--maph);padding:8px 0;gap:8px}
    header{display:none}
    .count{display:none}
    .ftoggle{display:block}
    body:not(.fopen) .frows{display:none}
    .maptoggle{display:block}
    .card{scroll-margin-top:calc(var(--maph) + 66px)}
    .dtop{top:var(--maph)}
    .detail h2{font-size:26px;margin-top:12px}
    .detail .embeds iframe{height:560px}
    body.fopen .card{scroll-margin-top:calc(var(--maph) + 200px)}
    input[type=search]{padding:8px 11px}
    .layout,.side,.detail{max-width:100vw}
    .embeds iframe{max-width:100%}
  }
</style>
</head>

://www.instagram.com/reel/C37Cd05obPZ/", "by": "Ky", "date": "2024-03-10", "owner": "chinainsider", "with": ["a friend"]}], "q": "Oplus Coffee, Yiwu, China"}, {"n": "CUM Coffee", "c": "Bangkok", "a": "Thonglor", "nb": "", "b": "", "k": "Coffee", "s": "Coffee bar with a cheeky name, at The Office Thonglor.", "p": [{"code": "Dd8lZ0zCBGM", "url": "https://www.instagram.com/p/Dd8lZ0zCBGM/", "by": "Ky", "date": "2026-11-03", "owner": "cumcoffee.th", "with": ["a friend"]}], "q": "CUM Coffee, Thonglor, Bangkok, Thailand"}, {"n": "Bánh mỳ Bảy Quán", "c": "Quy Nhơn", "a": "Quy Nhơn, Vietnam", "nb": "", "b": "", "k": "Vietnamese", "s": "A different style of bánh mì. 17 Nguyễn Công Trứ.", "p": [{"code": "DW3cpeDiZRq", "url": "https://www.instagram.com/reel/DW3cpeDiZRq/", "by": "Ky", "date": "2026-04-09", "owner": "curiousaboutvietnam", "with": ["a friend"]}], "q": "Bánh mỳ Bảy Quán, Quy Nhơn, Vietnam"}, {"n": "Whole Green Bakery", "c": "Sydney", "a": "Alexandria, Sydney", "nb": "", "b": "", "k": "Bakery & dessert", "s": "100% gluten-free bakery.", "p": [{"code": "C4bxpFgyeZl", "url": "https://www.instagram.com/reel/C4bxpFgyeZl/", "by": "Ky", "date": "2024-03-22", "owner": "fatimahomran_", "with": ["a friend"]}], "q": "Whole Green Bakery, Alexandria, Sydney, Australia"}, {"n": "Kenilworth Bakery", "c": "Queensland", "a": "Kenilworth, QLD", "nb": "", "b": "", "k": "Bakery & dessert", "s": "Famous coffee donut, lined with Nutella.", "p": [{"code": "C5iNKIkPFTi", "url": "https://www.instagram.com/reel/C5iNKIkPFTi/", "by": "Ky", "date": "2024-04-21", "owner": "hungry.piglet", "with": ["a friend"]}], "q": "Kenilworth Bakery, Kenilworth, QLD, Australia"}];

const state = {city:'All', boro:'All', hood:'All', cuisine:'All', q:''};
const count = (arr, key) => arr.reduce((m,x)=>(m[key(x)]=(m[key(x)]||0)+1,m),{});
const cityCounts = count(DATA, x=>x.c);
const cityOrder = Object.keys(cityCounts).sort((a,b)=>cityCounts[b]-cityCounts[a]||a.localeCompare(b));
const cuisineCounts = count(DATA, x=>x.k);
const cuisineOrder = Object.keys(cuisineCounts).sort((a,b)=>cuisineCounts[b]-cuisineCounts[a]||a.localeCompare(b));
const nyc = DATA.filter(x=>x.c==='New York');
const boroOrder = ['Manhattan','Brooklyn','Queens','NYC'].filter(b=>nyc.some(x=>x.b===b));
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
const gmaps = x => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.q);
DATA.forEach((x,i)=>x.id=i);

document.getElementById('sub').textContent =
  `${DATA.length} places from ${DATA.reduce((n,x)=>n+x.p.length,0)} posts traded with friends in Instagram DMs, sorted by city and cuisine.`;

function chips(el, items, key, counts, label){
  el.innerHTML = (label?`<span class="lbl">${label}</span>`:'') + ['All',...items].map(v =>
    `<button class="chip" data-v="${esc(v)}" aria-pressed="${state[key]===v}">${esc(v)}${counts&&v!=='All'&&counts[v]?`<small>${counts[v]}</small>`:''}</button>`).join('');
  el.onclick = e => { const b=e.target.closest('.chip'); if(!b) return; state[key]=b.dataset.v;
    if(key==='city'){ state.boro='All'; state.hood='All'; }
    if(key==='boro'){ state.hood='All'; }
    renderBars(); render(true); updateToggle(); };
}
function renderBars(){
  chips(document.getElementById('cities'), cityOrder, 'city', cityCounts);
  const showNY = state.city==='New York';
  const boros=document.getElementById('boros'), hoods=document.getElementById('hoods');
  boros.hidden = hoods.hidden = !showNY;
  if(showNY){
    chips(boros, boroOrder, 'boro', count(nyc,x=>x.b), 'Borough');
    const pool = nyc.filter(x=>state.boro==='All'||x.b===state.boro);
    const hc = count(pool, x=>x.nb);
    const hs = Object.keys(hc).filter(h=>h!=='Other').sort((a,b)=>hc[b]-hc[a]||a.localeCompare(b));
    if(hc.Other) hs.push('Other');
    chips(hoods, hs, 'hood', hc, 'Neighborhood');
  }
  chips(document.getElementById('cuisines'), cuisineOrder, 'cuisine', cuisineCounts);
}

function match(x){
  if(state.city!=='All' && x.c!==state.city) return false;
  if(state.city==='New York'){
    if(state.boro!=='All' && x.b!==state.boro) return false;
    if(state.hood!=='All' && x.nb!==state.hood) return false;
  }
  if(state.cuisine!=='All' && x.k!==state.cuisine) return false;
  if(state.q){ const h=(x.n+' '+x.a+' '+x.k+' '+x.s+' '+x.c).toLowerCase(); if(!h.includes(state.q)) return false; }
  return true;
}

function who(p){
  const others = p.with.filter(n=>n!==p.by);
  if(p.by!=='Ky') others.unshift('Ky');
  return `<span class="by ${p.by==='Ky'?'Ky':''}">${esc(p.by)}</span> → ${esc(others.join(', '))}`;
}
function card(x){
  const last = x.p[0];
  return `<article class="card${x.id===activeId?' active':''}" id="c${x.id}" tabindex="0" role="button" aria-label="${esc(x.n)}">
    <h4>${esc(x.n)}</h4>
    <div class="area">${esc(x.a)} · ${esc(x.k)}</div>
    <p class="sum">${esc(x.s)}</p>
    <div class="who">${who(last)} · ${fmt(last.date)}${x.p.length>1?` · +${x.p.length-1} more`:''}</div>
  </article>`;
}
function detailHTML(x){
  const senders = x.p.map(p=>`<div>${who(p)} · ${fmt(p.date)}</div>`).join('');
  const uniq = [...new Map(x.p.map(p=>[p.code,p])).values()];
  const links = uniq.map((p,i)=>`<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Instagram${uniq.length>1?' '+(i+1):''} ↗</a>`).join('');
  const embeds = uniq.map(p=>`<iframe src="https://www.instagram.com/p/${encodeURIComponent(p.code)}/embed/" loading="lazy" allowtransparency="true" scrolling="no" title="Instagram post about ${esc(x.n)}"></iframe>`).join('');
  return `<div class="dtop">
      <button class="back" data-close>← All places</button>
      <button class="xbtn" data-close aria-label="Close">×</button>
    </div>
    <h2>${esc(x.n)}</h2>
    <div class="area">${esc(x.a)} · ${esc(x.k)}</div>
    <p class="dsum">${esc(x.s)}</p>
    <div class="meta"><div>${senders}</div><span>via @${esc(x.p[0].owner)}</span></div>
    <div class="acts">
      <a class="btn primary" href="${gmaps(x)}" target="_blank" rel="noopener">Directions ↗</a>
      ${links}
    </div>
    <div class="embeds">${embeds}</div>`;
}

let visible = DATA;
function render(fit){
  const list = document.getElementById('list');
  visible = DATA.filter(match);
  document.getElementById('count').textContent = `${visible.length} place${visible.length===1?'':'s'}`;
  if(!visible.length){ list.innerHTML='<div class="empty">Nothing matches.</div>'; syncMarkers(fit); return; }
  let html='';
  for(const city of cityOrder){
    const inCity = visible.filter(x=>x.c===city);
    if(!inCity.length) continue;
    html += `<section class="city"><h2>${esc(city)} <small>${inCity.length}</small></h2>`;
    const cuis = [...new Set(inCity.map(x=>x.k))].sort();
    for(const k of cuis){
      const g = inCity.filter(x=>x.k===k).sort((a,b)=>a.n.localeCompare(b.n));
      html += `<h3>${esc(k)}</h3><div class="grid">${g.map(card).join('')}</div>`;
    }
    html += '</section>';
  }
  list.innerHTML = html;
  syncMarkers(fit);
}

document.getElementById('list').addEventListener('click', e=>{
  if(e.target.closest('a')) return;
  const c = e.target.closest('.card'); if(c) openPlace(Number(c.id.slice(1)));
});
document.getElementById('list').addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const c = e.target.closest('.card'); if(c){ e.preventDefault(); openPlace(Number(c.id.slice(1))); }
});
document.getElementById('detail').addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closePlace(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.body.classList.contains('detailing')) closePlace(); });
window.addEventListener('popstate', ()=>{ if(document.body.classList.contains('detailing')) closePlace(true); });

document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value.trim().toLowerCase(); render(true); });

// ---------------- Map ----------------
let map, info, geocoder, activeId=null;
const markers = new Map();
const CACHE_KEY = 'eats_geo_v1';
let cache = {}; try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY)||'{}'); }catch(e){}
const saveCache = ()=>{ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){} };

const MAP_STYLE = [
  {elementType:'geometry',stylers:[{color:'#efeae0'}]},
  {elementType:'labels.text.fill',stylers:[{color:'#7a7268'}]},
  {elementType:'labels.text.stroke',stylers:[{color:'#f4f1ea'}]},
  {featureType:'poi',stylers:[{visibility:'off'}]},
  {featureType:'transit',stylers:[{visibility:'simplified'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#fbf9f4'}]},
  {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#e6dfd1'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#cfd9dc'}]},
  {featureType:'landscape.natural',elementType:'geometry',stylers:[{color:'#e7e1d4'}]}
];

function infoHTML(x){
  return `<div class="iw"><b>${esc(x.n)}</b><div class="s">${esc(x.k)} · ${esc(x.a)}</div>
    <div>${esc(x.s)}</div><div style="margin-top:8px">
    <a href="${gmaps(x)}" target="_blank" rel="noopener">Directions ↗</a>
    <a href="${esc(x.p[0].url)}" target="_blank" rel="noopener">Instagram ↗</a></div></div>`;
}
if('scrollRestoration' in history) history.scrollRestoration='manual';
const side = document.getElementById('side');
let savedScroll = 0;
const listScroll = () => isPhone() ? window.scrollY : side.scrollTop;
const setScroll = y => { if(isPhone()) window.scrollTo(0,y); else side.scrollTop = y; };
const PIN = {path:0, scale:7, fillColor:'#e2462c', fillOpacity:.95, strokeColor:'#fff', strokeWeight:1.5};
const PIN_ON = {path:0, scale:11, fillColor:'#16130f', fillOpacity:1, strokeColor:'#fff', strokeWeight:3};
function highlight(id){
  markers.forEach((m,mid)=>{ m.setIcon(mid===id?PIN_ON:PIN); m.setZIndex(mid===id?999:null); });
}
function openPlace(id){
  const x = DATA[id];
  const wasOpen = document.body.classList.contains('detailing');
  if(!wasOpen) savedScroll = listScroll();
  activeId = id;
  setFilters(false);
  const d = document.getElementById('detail');
  d.innerHTML = detailHTML(x); d.hidden = false;
  document.body.classList.add('detailing');
  setScroll(0);
  if(wasOpen) history.replaceState({place:id},''); else history.pushState({place:id},'');
  if(map){
    info.close();
    const m = markers.get(id);
    if(m){ highlight(id); map.panTo(m.getPosition()); if(map.getZoom()<14) map.setZoom(14); }
  }
  d.querySelector('.back').focus({preventScroll:true});
}
function closePlace(fromHistory){
  if(!document.body.classList.contains('detailing')) return;
  const id = activeId;
  document.body.classList.remove('detailing');
  const d = document.getElementById('detail'); d.hidden = true; d.innerHTML = '';
  if(map) highlight(-1);
  document.querySelectorAll('.card.active').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('c'+id);
  if(el) el.classList.add('active');
  const y = savedScroll;
  if(!fromHistory && history.state && history.state.place!==undefined) history.back();
  requestAnimationFrame(()=>setScroll(y));
  setTimeout(()=>setScroll(y), 60);
}
function addMarker(x, pos){
  const m = new google.maps.Marker({position:pos, title:x.n, icon: x.id===activeId && document.body.classList.contains('detailing') ? PIN_ON : PIN});
  m.addListener('click', ()=>openPlace(x.id));
  markers.set(x.id, m);
}
function syncMarkers(fit){
  if(!map) return;
  const ids = new Set(visible.map(x=>x.id));
  const bounds = new google.maps.LatLngBounds(); let n=0;
  markers.forEach((m,id)=>{ const on=ids.has(id); m.setMap(on?map:null); if(on){ bounds.extend(m.getPosition()); n++; } });
  if(fit && n){
    if(n===1){ map.setCenter(bounds.getCenter()); map.setZoom(15); }
    else { map.fitBounds(bounds, 40); google.maps.event.addListenerOnce(map,'idle',()=>{ if(map.getZoom()>15) map.setZoom(15); }); }
  }
}
async function geocodeAll(){
  const banner=document.getElementById('banner');
  const todo=[];
  DATA.forEach(x=>{ if(cache[x.q]) addMarker(x, cache[x.q]); else todo.push(x); });
  syncMarkers(false);
  if(!todo.length) return;
  banner.hidden=false; let done=0;
  for(const x of todo){
    await new Promise(res=>geocoder.geocode({address:x.q},(r,status)=>{
      if(status==='OK'&&r[0]){ const l=r[0].geometry.location; cache[x.q]={lat:l.lat(),lng:l.lng()}; addMarker(x,cache[x.q]); saveCache(); syncMarkers(false); }
      banner.textContent=`Pinning places ${++done}/${todo.length}`; setTimeout(res,120);
    }));
  }
  banner.hidden=true;
}
window.initMap = function(){
  map = new google.maps.Map(document.getElementById('map'), {
    center:{lat:40.722,lng:-73.975}, zoom:13, styles:MAP_STYLE,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:true, clickableIcons:false,
    gestureHandling:'greedy'
  });
  info = new google.maps.InfoWindow(); geocoder = new google.maps.Geocoder();
  geocodeAll();
};
function useMyMaps(){
  const msg=document.getElementById('mapmsg');
  if(!MYMAPS_ID){ msg.hidden=false; msg.textContent='The map couldn’t load.'; return; }
  map=null; markers.clear();
  document.getElementById('banner').hidden=true;
  document.getElementById('map').innerHTML = `<iframe src="https://www.google.com/maps/d/embed?mid=${encodeURIComponent(MYMAPS_ID)}&ehbc=2E312F&noprof=1&ll=40.722%2C-73.975&z=13" title="Map of all the places" style="width:100%;height:calc(100% + 60px);margin-top:-60px;border:0" loading="lazy" allowfullscreen></iframe>`;
  document.body.classList.add('mymaps');
}
// Google calls this if the key is rejected (wrong site, API not enabled, billing off)
window.gm_authFailure = useMyMaps;
(function(){
  if(!GOOGLE_MAPS_API_KEY){ useMyMaps(); return; }
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&loading=async&callback=initMap';
  s.async=true; s.onerror=useMyMaps;
  document.head.appendChild(s);
})();

document.getElementById('maptoggle').onclick = e => {
  const big=document.body.classList.toggle('mapbig');
  e.target.textContent = big ? 'Smaller map' : 'Bigger map';
  if(map) setTimeout(()=>google.maps.event.trigger(map,'resize'),250);
};

// ---- Phone: collapsible filters ----
const isPhone = () => window.matchMedia('(max-width:900px)').matches;
const ftoggle = document.getElementById('ftoggle');
function activeFilterCount(){
  return ['city','boro','hood','cuisine'].filter(k=>state[k]!=='All').length;
}
function updateToggle(){
  const n = activeFilterCount(), open = document.body.classList.contains('fopen');
  ftoggle.textContent = open ? 'Done' : (n ? `Filters · ${n}` : 'Filters');
  ftoggle.classList.toggle('on', open || n>0);
  ftoggle.setAttribute('aria-expanded', open);
}
function setFilters(open){ document.body.classList.toggle('fopen', open); updateToggle(); }
ftoggle.onclick = () => setFilters(!document.body.classList.contains('fopen'));
// collapse when the list is scrolled on a phone
let lastTop = 0;
function onListScroll(top){
  if(isPhone() && top > lastTop + 30 && document.body.classList.contains('fopen')) setFilters(false);
  lastTop = top;
}
window.addEventListener('scroll', ()=>onListScroll(window.scrollY), {passive:true});
document.getElementById('side').addEventListener('scroll', e=>onListScroll(e.target.scrollTop), {passive:true});
renderBars(); render(false); updateToggle();
</script>
</body>
